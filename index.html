<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TCO & Energy Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- ล็อกเวอร์ชัน Babel เป็น 7.23.6 -->
    <script src="https://unpkg.com/@babel/standalone@7.23.6/babel.min.js"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f8fafc; }
        .hide-scroll::-webkit-scrollbar { display: none; }
        .hide-scroll { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel" data-presets="react">
        function App() {
            // ตั้งค่าเริ่มต้นให้โหมดหัวลากเป็นค่าเริ่มต้น
            const [mode, ReactSetMode] = React.useState('tractor');

            // =====================================================================
            // 📌 จุดที่ 1: แก้ไขค่าเริ่มต้น (Default Values) ได้ที่นี่!
            // =====================================================================
            const [inputs, setInputs] = React.useState({
                // --- ค่าทั่วไป ---
                workDaysPerYear: 300,        
                dieselPrice: 39.0,           
                electricityPrice: 5.0,       
                
                // --- 🚜 โหมดรถตัก (Loader) - ชม. ---
                loaderWorkHoursPerDay: 12,       
                loaderDieselConsumption: 9,     
                loaderEvConsumption: 24.5,         
                loaderDieselMachinePrice: 3500000, 
                loaderEvMachinePrice: 4500000,     
                loaderDieselMaintenance: 50000,   
                loaderEvMaintenance: 20000,        

                // --- 🚛 โหมดรถหัวลาก (Tractor) - กม. ---
                tractorDistancePerDay: 400,      
                tractorDieselConsumption: 3.0,   
                tractorEvConsumption: 1.3,       
                tractorDieselMachinePrice: 3200000, 
                tractorEvMachinePrice: 4900000,     
                tractorDieselMaintenance: 100000,   
                tractorEvMaintenance: 50000,        

                // --- 🔄 โหมดรถโม่ปูน (Mixer) - กม. ---
                mixerDistancePerDay: 100,        
                mixerDieselConsumption: 2.2,     
                mixerEvConsumption: 1.50,         
                mixerDieselMachinePrice: 3500000,  
                mixerEvMachinePrice: 3900000,      
                mixerDieselMaintenance: 100000,    
                mixerEvMaintenance: 50000,         

                // --- 📦 โหมดรถโฟล์คลิฟท์ (Forklift) - ชม. ---
                forkliftWorkHoursPerDay: 16,
                forkliftDieselConsumption: 6.5,     // ลิตร/ชม.
                forkliftEvConsumption: 4.04,         // kWh/ชม.
                forkliftDieselMachinePrice: 800000,
                forkliftEvMachinePrice: 500000,
                forkliftDieselMaintenance: 36000,
                forkliftEvMaintenance: 30000,

                // --- 🚚 โหมดรถ 6 ล้อ (Six Wheel) - กม. ---
                sixwheelDistancePerDay: 200,
                sixwheelDieselConsumption: 5.0,   // กม./ลิตร
                sixwheelEvConsumption: 0.9,       // kWh/กม.
                sixwheelDieselMachinePrice: 2500000,
                sixwheelEvMachinePrice: 2900000,
                sixwheelDieselMaintenance: 30000,
                sixwheelEvMaintenance: 17000,

                // --- 🛻 โหมดรถ 4 ล้อ (Four Wheel) - กม. ---
                fourwheelDistancePerDay: 150,
                fourwheelDieselConsumption: 8.3,  // กม./ลิตร
                fourwheelEvConsumption: 0.23,       // kWh/กม.
                fourwheelDieselMachinePrice: 1130000,
                fourwheelEvMachinePrice: 1050000,
                fourwheelDieselMaintenance: 13000,
                fourwheelEvMaintenance: 13000,
            });
            // =====================================================================

            const [results, setResults] = React.useState({
                yearlyWorkload: 0,
                dieselCostPerDay: 0,
                dieselCostPerYear: 0,
                evCostPerDay: 0,
                evCostPerYear: 0,
                savingsPerDay: 0,
                savingsPerYear: 0,
                savingPercentage: 0, 
                co2Reduced: 0,
                investmentDiff: 0,
                roiYears: 0,
                yearlyDieselLiter: 0,
                yearlyEvKwh: 0,
                tcoDiesel5Y: 0,
                tcoEv5Y: 0,
                tcoSaving5Y: 0
            });

            React.useEffect(() => {
                let dailyDieselCost = 0;
                let dailyEvCost = 0;
                let yearlyWorkload = 0;
                let dailyDieselLiter = 0;
                let dailyEvKwh = 0;

                // ดึงราคารถและค่าซ่อมบำรุงตามโหมดที่เลือก
                let activeDieselMachinePrice = inputs[`${mode}DieselMachinePrice`];
                let activeEvMachinePrice = inputs[`${mode}EvMachinePrice`];
                let activeDieselMaintenance = inputs[`${mode}DieselMaintenance`];
                let activeEvMaintenance = inputs[`${mode}EvMaintenance`];

                // กลุ่มที่คิดตามชั่วโมง
                if (mode === 'loader' || mode === 'forklift') {
                    yearlyWorkload = inputs[`${mode}WorkHoursPerDay`] * inputs.workDaysPerYear;
                    dailyDieselLiter = inputs[`${mode}DieselConsumption`] * inputs[`${mode}WorkHoursPerDay`];
                    dailyEvKwh = inputs[`${mode}EvConsumption`] * inputs[`${mode}WorkHoursPerDay`];
                } 
                // กลุ่มที่คิดตามระยะทาง
                else if (mode === 'tractor' || mode === 'mixer' || mode === 'sixwheel' || mode === 'fourwheel') {
                    yearlyWorkload = inputs[`${mode}DistancePerDay`] * inputs.workDaysPerYear;
                    dailyDieselLiter = inputs[`${mode}DistancePerDay`] / inputs[`${mode}DieselConsumption`];
                    dailyEvKwh = inputs[`${mode}DistancePerDay`] * inputs[`${mode}EvConsumption`];
                }

                // คำนวณรายจ่ายต่อวันและปี
                dailyDieselCost = dailyDieselLiter * inputs.dieselPrice;
                dailyEvCost = dailyEvKwh * inputs.electricityPrice;
                const dieselCostPerYear = dailyDieselCost * inputs.workDaysPerYear;
                const evCostPerYear = dailyEvCost * inputs.workDaysPerYear;
                const yearlyDieselLiterTotal = dailyDieselLiter * inputs.workDaysPerYear;
                const yearlyEvKwhTotal = dailyEvKwh * inputs.workDaysPerYear;
                
                const savingsPerDay = dailyDieselCost - dailyEvCost;
                const savingsPerYear = dieselCostPerYear - evCostPerYear;
                const savingPercentage = dieselCostPerYear > 0 ? (savingsPerYear / dieselCostPerYear) * 100 : 0;

                // คำนวณ ROI และส่วนต่าง
                const investmentDiff = activeEvMachinePrice - activeDieselMachinePrice;
                let roiYears = 0;
                const totalYearlySavings = savingsPerYear + (activeDieselMaintenance - activeEvMaintenance);
                
                if (investmentDiff > 0 && totalYearlySavings > 0) {
                    roiYears = investmentDiff / totalYearlySavings;
                } else if (investmentDiff <= 0) {
                    roiYears = 0;
                }

                // ลดคาร์บอน (1 ลิตร ดีเซล = 2.68 kg CO2)
                const co2Reduced = (yearlyDieselLiterTotal * 2.68) / 1000;

                // TCO 5 ปี
                const tcoDiesel5Y = activeDieselMachinePrice + (dieselCostPerYear * 5) + (activeDieselMaintenance * 5);
                const tcoEv5Y = activeEvMachinePrice + (evCostPerYear * 5) + (activeEvMaintenance * 5);
                const tcoSaving5Y = tcoDiesel5Y - tcoEv5Y;

                setResults({
                    yearlyWorkload, dieselCostPerDay: dailyDieselCost, dieselCostPerYear: dieselCostPerYear,
                    evCostPerDay: dailyEvCost, evCostPerYear: evCostPerYear, savingsPerDay: savingsPerDay,
                    savingsPerYear: savingsPerYear, savingPercentage, co2Reduced, investmentDiff,
                    roiYears, yearlyDieselLiter: yearlyDieselLiterTotal, yearlyEvKwh: yearlyEvKwhTotal,
                    tcoDiesel5Y, tcoEv5Y, tcoSaving5Y
                });
            }, [inputs, mode]);

            const handleInputChange = (e) => {
                const { name, value } = e.target;
                setInputs(prev => ({ ...prev, [name]: parseFloat(value) || 0 }));
            };

            const formatCurrency = (number) => new Intl.NumberFormat('th-TH', { maximumFractionDigits: 0 }).format(number);
            const formatDecimal = (number) => new Intl.NumberFormat('th-TH', { maximumFractionDigits: 1, minimumFractionDigits: 1 }).format(number);

            const currentDieselPrice = inputs[`${mode}DieselMachinePrice`];
            const currentEvPrice = inputs[`${mode}EvMachinePrice`];
            const currentDieselMaint = inputs[`${mode}DieselMaintenance`];
            const currentEvMaint = inputs[`${mode}EvMaintenance`];

            // เช็คว่าโหมดปัจจุบันเป็นโหมดที่คิดตามชั่วโมงหรือไม่
            const isHourlyMode = mode === 'loader' || mode === 'forklift';

            return (
                <div className="min-h-screen py-8 px-4 sm:px-6 lg:px-8">
                    <div className="max-w-6xl mx-auto">
                        
                        <div className="text-center mb-10">
                            <h1 className="text-3xl font-bold text-gray-900 sm:text-4xl mb-4">
                                TCO & Energy Calculator
                            </h1>
                            <p className="text-lg text-gray-500 mb-6">
                                เครื่องมือประเมินต้นทุนรวม (TCO) และการประหยัดพลังงาน ระหว่างเครื่องยนต์ดีเซลและรถไฟฟ้า (EV)
                            </p>
                            
                            {/* ปุ่มเลือกหมวดหมู่รถ 6 แบบ */}
                            <div className="inline-flex bg-gray-200 p-1.5 rounded-2xl shadow-sm flex-wrap justify-center gap-1.5">
                                <button onClick={() => ReactSetMode('tractor')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'tractor' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M10 17h4V5H2v12h3"/><path d="M20 17h2v-3.34a4 4 0 0 0-1.17-2.83L19 9h-5"/><path d="M14 17h1"/><circle cx="7.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/></svg>
                                    หัวลาก
                                </button>
                                <button onClick={() => ReactSetMode('mixer')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'mixer' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                    โม่ปูน
                                </button>
                                <button onClick={() => ReactSetMode('sixwheel')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'sixwheel' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M8 19h8"/><path d="M8 5h8"/><path d="M4 15V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v6a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="7" cy="19" r="2"/><circle cx="17" cy="19" r="2"/></svg>
                                    6 ล้อ
                                </button>
                                <button onClick={() => ReactSetMode('fourwheel')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'fourwheel' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11h12zm0 0h2.5a2.5 2.5 0 0 0 2.5-2.5V11a2 2 0 0 0-2-2h-3v9z"/><circle cx="6" cy="18" r="2"/><circle cx="16" cy="18" r="2"/></svg>
                                    4 ล้อ (กระบะ)
                                </button>
                                <button onClick={() => ReactSetMode('loader')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'loader' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="m10 11 11 .9c.6 0 .9.5.8 1.1l-.8 5h-1"/><path d="M16 18h-5"/><path d="M18 5a1 1 0 0 0-1 1v5.573"/><path d="M3 18h-.5"/><path d="M4 7l8-2.5"/><path d="M5 11l-.854.854A2 2 0 0 0 3.56 13.27L3.14 15.8a2 2 0 0 0 1.95 2.27H6"/><circle cx="18" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg>
                                    รถตัก
                                </button>
                                <button onClick={() => ReactSetMode('forklift')} className={`flex items-center px-4 py-2.5 rounded-xl text-sm font-medium transition-all ${mode === 'forklift' ? 'bg-white text-blue-700 shadow-sm ring-1 ring-black/5' : 'text-gray-600 hover:text-gray-900'}`}>
                                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="mr-2"><path d="M12 12H5a2 2 0 0 0-2 2v5h18v-2l-3-3V3a1 1 0 0 0-1-1H9a1 1 0 0 0-1 1v9H5"/><path d="M2 19h20v2H2z"/></svg>
                                    โฟล์คลิฟท์
                                </button>
                            </div>
                        </div>

                        <div className="grid grid-cols-1 lg:grid-cols-12 gap-8">
                            
                            {/* ฝั่งซ้าย: ข้อมูล Input */}
                            <div className="lg:col-span-4 space-y-6">
                                
                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-lg font-semibold text-gray-800 mb-5 flex items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2 text-blue-500"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>
                                        1. การทำงาน & การลงทุน
                                    </h2>
                                    <div className="space-y-4">
                                        {isHourlyMode ? (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">ชั่วโมงทำงาน (ชม./วัน)</label>
                                                <input type="number" name={`${mode}WorkHoursPerDay`} value={inputs[`${mode}WorkHoursPerDay`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 outline-none" />
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">ระยะการวิ่ง (กม./วัน)</label>
                                                <input type="number" name={`${mode}DistancePerDay`} value={inputs[`${mode}DistancePerDay`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 outline-none" />
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">วันทำงานต่อปี (วัน)</label>
                                            <input type="number" name="workDaysPerYear" value={inputs.workDaysPerYear} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-blue-500 outline-none" />
                                        </div>
                                        <div className="pt-3 border-t border-gray-100">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ราคารถดีเซล (บาท)</label>
                                            <input type="number" name={`${mode}DieselMachinePrice`} value={currentDieselPrice} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-orange-500 outline-none bg-orange-50/30" />
                                        </div>
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ราคารถ EV (บาท)</label>
                                            <input type="number" name={`${mode}EvMachinePrice`} value={currentEvPrice} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-green-500 outline-none bg-green-50/30" />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-lg font-semibold text-gray-800 mb-5 flex items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2 text-orange-500"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
                                        2. ระบบเครื่องยนต์ดีเซล
                                    </h2>
                                    <div className="space-y-4">
                                        {isHourlyMode ? (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">อัตราสิ้นเปลือง (ลิตร/ชม.)</label>
                                                <input type="number" name={`${mode}DieselConsumption`} value={inputs[`${mode}DieselConsumption`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-orange-500 outline-none" />
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">อัตราสิ้นเปลือง (กม./ลิตร)</label>
                                                <input type="number" name={`${mode}DieselConsumption`} value={inputs[`${mode}DieselConsumption`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-orange-500 outline-none" />
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ราคาน้ำมัน (บาท/ลิตร)</label>
                                            <input type="number" name="dieselPrice" value={inputs.dieselPrice} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-orange-500 outline-none" />
                                        </div>
                                        <div className="pt-2 border-t border-gray-100">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ค่าซ่อมบำรุงประมาณการ (บาท/ปี)</label>
                                            <input type="number" name={`${mode}DieselMaintenance`} value={currentDieselMaint} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-orange-500 outline-none" />
                                        </div>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h2 className="text-lg font-semibold text-gray-800 mb-5 flex items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2 text-green-500"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                        3. ระบบรถไฟฟ้า (EV)
                                    </h2>
                                    <div className="space-y-4">
                                        {isHourlyMode ? (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">การใช้พลังงาน (kWh/ชม.)</label>
                                                <input type="number" name={`${mode}EvConsumption`} value={inputs[`${mode}EvConsumption`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-green-500 outline-none" />
                                            </div>
                                        ) : (
                                            <div>
                                                <label className="block text-sm font-medium text-gray-700 mb-1">การใช้พลังงาน (kWh/กม.)</label>
                                                <input type="number" name={`${mode}EvConsumption`} value={inputs[`${mode}EvConsumption`]} onChange={handleInputChange}
                                                    className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-green-500 outline-none" />
                                            </div>
                                        )}
                                        <div>
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ค่าไฟเฉลี่ย (บาท/kWh)</label>
                                            <input type="number" name="electricityPrice" value={inputs.electricityPrice} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-green-500 outline-none" />
                                        </div>
                                        <div className="pt-2 border-t border-gray-100">
                                            <label className="block text-sm font-medium text-gray-700 mb-1">ค่าซ่อมบำรุงประมาณการ (บาท/ปี)</label>
                                            <input type="number" name={`${mode}EvMaintenance`} value={currentEvMaint} onChange={handleInputChange}
                                                className="w-full px-3 py-2 border border-gray-300 rounded-md focus:ring-1 focus:ring-green-500 outline-none" />
                                        </div>
                                    </div>
                                </div>

                            </div>

                            {/* ฝั่งขวา: ผลลัพธ์ Dashboard */}
                            <div className="lg:col-span-8 space-y-6">
                                
                                <div className="bg-gradient-to-br from-blue-800 to-indigo-900 rounded-2xl shadow-lg p-6 sm:p-8 text-white relative overflow-hidden">
                                    <div className="relative z-10 flex flex-col md:flex-row justify-between gap-6">
                                        <div className="flex-1">
                                            <p className="text-blue-200 text-sm font-medium mb-1">ประหยัดค่าพลังงานได้สูงสุดถึง</p>
                                            <div className="flex items-end flex-wrap gap-2">
                                                <span className="text-4xl lg:text-5xl font-extrabold tracking-tight text-white">
                                                    {formatCurrency(results.savingsPerYear)}
                                                </span>
                                                <span className="text-lg text-blue-200 pb-1">บาท / ปี</span>
                                                <div className="ml-2 mb-2 inline-flex items-center bg-green-500 text-white font-bold rounded-lg px-3 py-1 shadow-sm">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1"><polyline points="22 17 13.5 8.5 8.5 13.5 2 7"/><polyline points="16 17 22 17 22 11"/></svg>
                                                    {formatDecimal(results.savingPercentage)}%
                                                </div>
                                            </div>
                                            <div className="mt-4 inline-flex items-center bg-white/10 rounded-full px-3 py-1.5 text-sm backdrop-blur-sm border border-white/20">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-2 text-green-400"><path d="M11 20A7 7 0 0 1 14 6c1.6 0 3.2.7 4.2 1.8A7.8 7.8 0 0 1 20 13a11 11 0 0 1-9 7Z"/><path d="M11 20A7 7 0 0 1 4 13c0-1.9.7-3.8 2-5a11 11 0 0 1 8-2 11 11 0 0 1 4 2"/><path d="M11 20V12"/></svg>
                                                ลดคาร์บอนฟุตพริ้นท์ (CO2) ได้ {formatCurrency(results.co2Reduced)} ตัน/ปี
                                            </div>
                                        </div>
                                        
                                        <div className="bg-white/10 backdrop-blur-md rounded-xl p-5 border border-white/20 min-w-[200px] flex flex-col justify-center text-center md:text-left">
                                            <p className="text-blue-200 text-sm font-medium mb-1">คืนทุนส่วนต่างรถ</p>
                                            <div className="flex items-baseline justify-center md:justify-start">
                                                <span className="text-4xl font-extrabold text-green-400">
                                                    {results.investmentDiff <= 0 ? "ทันที" : (results.roiYears > 0 ? formatDecimal(results.roiYears) : "N/A")}
                                                </span>
                                                {results.investmentDiff > 0 && results.roiYears > 0 && <span className="ml-2 text-lg text-blue-200">ปี</span>}
                                            </div>
                                            <p className="text-xs text-blue-300 mt-2">
                                                คิดรวมค่าไฟและบำรุงรักษาแล้ว
                                            </p>
                                        </div>
                                    </div>
                                    <div className="absolute -right-10 -top-10 w-64 h-64 bg-blue-500 opacity-20 rounded-full blur-3xl"></div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                                    <div className="p-5 border-b border-gray-100 bg-gray-50 flex justify-between items-center">
                                        <h3 className="text-lg font-semibold text-gray-800">
                                            ตารางวิเคราะห์ต้นทุนความเป็นเจ้าของ (TCO) ระยะ 5 ปี
                                        </h3>
                                    </div>
                                    
                                    <div className="overflow-x-auto">
                                        <table className="w-full text-left border-collapse">
                                            <thead>
                                                <tr className="bg-gray-50/50 text-sm md:text-base">
                                                    <th className="p-4 border-b border-gray-100 text-gray-500 font-medium w-1/3">รายการ (Cost Item)</th>
                                                    <th className="p-4 border-b border-gray-100 font-semibold text-orange-600 bg-orange-50/30 w-1/3">
                                                        <div className="flex items-center">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-2"><path d="M12 22a7 7 0 0 0 7-7c0-2-1-3.9-3-5.5s-3.5-4-4-6.5c-.5 2.5-2 4.9-4 6.5C6 11.1 5 13 5 15a7 7 0 0 0 7 7z"/></svg>
                                                            ดีเซล (Diesel)
                                                        </div>
                                                    </th>
                                                    <th className="p-4 border-b border-gray-100 font-semibold text-green-600 bg-green-50/30 w-1/3">
                                                        <div className="flex items-center">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-2"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
                                                            ไฟฟ้า (EV)
                                                        </div>
                                                    </th>
                                                </tr>
                                            </thead>
                                            <tbody className="text-sm md:text-base">
                                                <tr>
                                                    <td className="p-4 border-b border-gray-100 font-medium text-gray-700">1. ค่าเครื่องจักร (ราคารถ)</td>
                                                    <td className="p-4 border-b border-gray-100 text-gray-800">฿ {formatCurrency(currentDieselPrice)}</td>
                                                    <td className="p-4 border-b border-gray-100 text-gray-800">฿ {formatCurrency(currentEvPrice)}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 border-b border-gray-100 font-medium text-gray-700">2. ค่าพลังงานรายปี</td>
                                                    <td className="p-4 border-b border-gray-100 text-orange-600">฿ {formatCurrency(results.dieselCostPerYear)}</td>
                                                    <td className="p-4 border-b border-gray-100 text-green-600">฿ {formatCurrency(results.evCostPerYear)}</td>
                                                </tr>
                                                <tr>
                                                    <td className="p-4 border-b border-gray-100 font-medium text-gray-700">3. ค่าบำรุงรักษารายปี</td>
                                                    <td className="p-4 border-b border-gray-100 text-orange-600">฿ {formatCurrency(currentDieselMaint)}</td>
                                                    <td className="p-4 border-b border-gray-100 text-green-600">฿ {formatCurrency(currentEvMaint)}</td>
                                                </tr>
                                                <tr className="bg-gray-50/30">
                                                    <td className="p-4 border-b border-gray-100 font-medium text-gray-900">รวมรายจ่ายต่อปี (ข้อ 2+3)</td>
                                                    <td className="p-4 border-b border-gray-100 text-gray-900 font-semibold">฿ {formatCurrency(results.dieselCostPerYear + currentDieselMaint)}</td>
                                                    <td className="p-4 border-b border-gray-100 text-gray-900 font-semibold">฿ {formatCurrency(results.evCostPerYear + currentEvMaint)}</td>
                                                </tr>
                                                <tr className="bg-blue-50/40">
                                                    <td className="p-4 font-bold text-blue-900">
                                                        รวมต้นทุนสะสม 5 ปี (TCO)
                                                        <div className="text-xs font-normal text-blue-600 mt-1">ราคารถ + (พลังงาน+บำรุงรักษา)*5</div>
                                                    </td>
                                                    <td className="p-4 font-bold text-gray-800 text-lg">฿ {formatCurrency(results.tcoDiesel5Y)}</td>
                                                    <td className="p-4 font-bold text-gray-800 text-lg">
                                                        ฿ {formatCurrency(results.tcoEv5Y)}
                                                        <div className="text-sm text-green-600 mt-1 flex items-center">
                                                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 mr-1"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
                                                            ประหยัด TCO = ฿ {formatCurrency(results.tcoSaving5Y)}
                                                        </div>
                                                    </td>
                                                </tr>
                                            </tbody>
                                        </table>
                                    </div>
                                </div>

                                <div className="bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
                                    <h3 className="text-lg font-semibold text-gray-800 mb-4 flex items-center">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-5 h-5 mr-2 text-yellow-500"><circle cx="12" cy="8" r="6"/><path d="M15.477 12.89 17 22l-5-3-5 3 1.523-9.11"/></svg>
                                        ข้อดีและสิทธิประโยชน์ของรถพลังงานไฟฟ้า (EV Benefits)
                                    </h3>
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                        <div className="flex items-start">
                                            <div className="flex-shrink-0 mt-1">
                                                <div className="w-8 h-8 rounded-full bg-green-100 flex items-center justify-center">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-green-600"><path d="M11 20A7 7 0 0 1 14 6c1.6 0 3.2.7 4.2 1.8A7.8 7.8 0 0 1 20 13a11 11 0 0 1-9 7Z"/><path d="M11 20A7 7 0 0 1 4 13c0-1.9.7-3.8 2-5a11 11 0 0 1 8-2 11 11 0 0 1 4 2"/><path d="M11 20V12"/></svg>
                                                </div>
                                            </div>
                                            <div className="ml-4">
                                                <h4 className="text-sm font-semibold text-gray-900">Zero Emission & ESG</h4>
                                                <p className="text-sm text-gray-500 mt-1">ลดการปล่อยก๊าซเรือนกระจก (CO2) และมลพิษทางอากาศ (PM2.5) ยกระดับภาพลักษณ์องค์กรสู่ความยั่งยืน</p>
                                            </div>
                                        </div>
                                        <div className="flex items-start">
                                            <div className="flex-shrink-0 mt-1">
                                                <div className="w-8 h-8 rounded-full bg-blue-100 flex items-center justify-center">
                                                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="w-4 h-4 text-blue-600"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
                                                </div>
                                            </div>
                                            <div className="ml-4">
                                                <h4 className="text-sm font-semibold text-gray-900">ลดค่าใช้จ่ายการซ่อมบำรุง</h4>
                                                <p className="text-sm text-gray-500 mt-1">ไม่มีเครื่องยนต์ ไม่มีน้ำมันเครื่องหรือไส้กรอง ชิ้นส่วนเคลื่อนไหวน้อยลง ทำให้ลด Downtime ในการซ่อมบำรุง</p>
                                            </div>
                                        </div>
                                    </div>
                                </div>

                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
